name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: gofmt check (unix only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          OUT="$(gofmt -l .)"
          if [ -n "$OUT" ]; then echo "$OUT"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: staticcheck (SA1019 deprecations excluded)
        run: go run honnef.co/go/tools/cmd/staticcheck@latest -checks "all,-SA1019" ./internal/... ./cmd/...

  build:
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: CGO_ENABLED=0 go build -trimpath ./cmd/hearth ./cmd/hearth-agent
