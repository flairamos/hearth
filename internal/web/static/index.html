<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hearth — 炉边</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="side-head">
      <span class="logo">hearth<span class="cursor"></span></span>
      <button id="btn-new" title="新建会话">＋</button>
    </div>
    <ul id="session-list"></ul>
    <div class="side-info" id="side-info"></div>
  </aside>
  <main id="main">
    <div id="chat"></div>
    <div id="approval" class="hidden">
      <div class="ap-title">⚠ 工具需要审批：<span id="ap-tool"></span></div>
      <pre id="ap-detail"></pre>
      <div class="ap-actions">
        <button id="ap-once">允许一次 [a]</button>
        <button id="ap-session">本会话允许 [s]</button>
        <button id="ap-deny" class="danger">拒绝 [d]</button>
      </div>
    </div>
    <div id="inputbar">
      <div id="picker"></div>
      <textarea id="input" rows="3" placeholder="message…（Shift+Enter 换行 · @ 引用文件 · / 命令）"></textarea>
      <div id="metrics" class="dim"></div>
      <div class="bar-actions">
        <button id="btn-img" title="附加图片">📷</button>
        <input type="file" id="img-file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden">
        <button id="btn-retry" title="重新生成上一个回答">🔄</button>
        <button id="btn-export" title="导出会话为 Markdown">⬇</button>
        <span id="status" class="dim"></span>
        <span class="spacer"></span>
        <label class="agent-toggle"><input type="checkbox" id="agent-mode"> agent</label>
        <button id="btn-send">发送</button>
        <button id="btn-stop" class="hidden">停止</button>
      </div>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
